apiVersion: apps/v1
kind: Deployment
metadata:
  name: favorite-go
  labels:
    app: favorite-go
spec:
  replicas: 1

  selector:
    matchLabels:
      app: favorite-go

  template:
    metadata:
      labels:
        app: favorite-go

    spec:
      containers:
        - name: favorite-go
          image: sibelly/favorite-go:latest

          ports:
            - name: http
              containerPort: 5000
              protocol: TCP

          env:
            - name: REDIS_HOST
              value: redis:6379

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1

          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi

          volumeMounts:
            - name: favorite-go-bin
              mountPath: /shared

      volumes:
        - name: favorite-go-bin
          emptyDir: {}